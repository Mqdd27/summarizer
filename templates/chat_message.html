<div class="space-y-3 mb-4">
    <!-- User Question -->
    <div class="flex justify-end">
        <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 max-w-[85%] text-sm shadow">
            {{ question }}
        </div>
    </div>

    <!-- AI Answer -->
    <div class="flex justify-start">
        <div class="bg-dark-800 border border-dark-700 text-dark-200 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[90%] text-sm shadow">
            <div class="flex items-center gap-2 mb-1.5 text-xs text-indigo-400 font-semibold">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                AI Assistant
            </div>
            <div class="prose prose-sm text-dark-200">
                {{ answer_html | safe }}
            </div>
            {% if web_sources %}
            <details class="mt-3 border-t border-dark-700 pt-2 text-xs text-dark-400">
                <summary class="cursor-pointer text-indigo-400">External research sources ({{ web_sources | length }})</summary>
                <ul class="mt-2 space-y-1.5">
                    {% for source in web_sources %}
                    <li><a href="{{ source.url }}" target="_blank" rel="noopener noreferrer" class="text-indigo-300 hover:underline">{{ source.title }}</a></li>
                    {% endfor %}
                </ul>
            </details>
            {% endif %}
        </div>
    </div>
</div>
