<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Summarizer{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        .prose { max-width: none; }
        .prose h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #f1f5f9; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .prose h2 { font-size: 1.25rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #e2e8f0; }
        .prose h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #cbd5e1; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.7; color: #cbd5e1; }
        .prose ul, .prose ol { margin-bottom: 0.75rem; padding-left: 1.5rem; color: #cbd5e1; }
        .prose li { margin-bottom: 0.25rem; line-height: 1.6; }
        .prose ul { list-style-type: disc; }
        .prose ol { list-style-type: decimal; }
        .prose strong { color: #f1f5f9; font-weight: 600; }
        .prose em { color: #94a3b8; }
        .prose blockquote { border-left: 3px solid #6366f1; padding: 0.5rem 1rem; margin: 1rem 0; background: rgba(99,102,241,0.1); border-radius: 0 0.375rem 0.375rem 0; color: #a5b4fc; }
        .prose code { background: #1e293b; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.875rem; color: #a5b4fc; }
        .prose pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; border: 1px solid #1e293b; }
        .prose pre code { background: none; padding: 0; color: #e2e8f0; }
        .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .prose th { background: #1e293b; padding: 0.5rem 0.75rem; text-align: left; font-weight: 600; color: #e2e8f0; border: 1px solid #334155; }
        .prose td { padding: 0.5rem 0.75rem; border: 1px solid #334155; color: #cbd5e1; }
        .prose tr:nth-child(even) td { background: rgba(30,41,59,0.5); }
        .prose hr { border-color: #334155; margin: 1.5rem 0; }
        .prose a { color: #818cf8; text-decoration: underline; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: block; }
        .htmx-request .hide-on-request { display: none; }
        @keyframes pulse-slow { 0%,100%{opacity:1} 50%{opacity:.5} }
        .animate-pulse-slow { animation: pulse-slow 2s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
    </style>
</head>
<body class="bg-dark-950 text-dark-200 min-h-screen">
    <nav class="border-b border-dark-800 bg-dark-900/80 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-lg font-bold text-white">
                <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                AI Summarizer
            </a>
            <span class="text-xs text-dark-500 hidden sm:inline">Powered by Ollama</span>
        </div>
    </nav>
    <main class="max-w-5xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
    <script>
    function showToast(msg, type='success') {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        const colors = {success:'bg-green-600',error:'bg-red-600',info:'bg-indigo-600'};
        t.className = `toast px-4 py-2 rounded-lg text-white text-sm shadow-lg ${colors[type]||colors.info}`;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(()=>t.remove(),300); }, 3000);
    }
    function copyText(text, label) {
        navigator.clipboard.writeText(text).then(() => showToast(label + ' copied!')).catch(() => showToast('Copy failed', 'error'));
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
