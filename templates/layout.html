<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Summarizer{% endblock %}</title>
    <script>
        (() => { const saved = localStorage.getItem('summarizer-theme'); const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; })();
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root { --ground:#fff; --surface:#f4f1e8; --ink:#000; --muted:#666; --hairline:#ccc; --link:#00e; --visited:#551a8b; --space:8px; }
        html[data-theme="dark"] { --ground:#171717; --surface:#262626; --ink:#f5f5f5; --muted:#a3a3a3; --hairline:#525252; --link:#7db7ff; --visited:#c6a0f6; }
        html,body { transition:background-color .15s linear,color .15s linear; }
        * { box-sizing:border-box; }
        html { background:var(--ground); color:var(--ink); }
        body { margin:0; background:var(--ground); color:var(--ink); font-family:Georgia,"Times New Roman",serif; font-size:16px; line-height:1.45; }
        button,input,select,textarea { font:inherit; color:var(--ink); }
        button { cursor:pointer; }
        input,select,textarea { background-color:var(--ground); border-color:var(--ink); }
        input::placeholder,textarea::placeholder { color:var(--muted); opacity:1; }
        select option { background:var(--ground); color:var(--ink); }
        html[data-theme="dark"] input[type="file"] { color:var(--ink); }
        html[data-theme="dark"] input[type="file"]::file-selector-button { background:var(--surface); color:var(--ink); border:1px solid var(--hairline); padding:6px 9px; margin-right:8px; }
        html[data-theme="dark"] .selected-model-input, html[data-theme="dark"] #model-select, html[data-theme="dark"] #url-input, html[data-theme="dark"] #file-input { color:var(--ink) !important; background:var(--ground) !important; }
        html[data-theme="dark"] #url-btn, html[data-theme="dark"] #upload-btn { background:var(--ink) !important; color:var(--ground) !important; border-color:var(--ink) !important; }
        html[data-theme="dark"] #upload-btn:disabled { opacity:.7 !important; color:var(--muted) !important; }
        a { color:var(--link); text-decoration:underline; }
        a:visited { color:var(--visited); }
        :focus-visible { outline:2px solid var(--link); outline-offset:2px; }
        .site-header { border-bottom:1px solid var(--ink); }
        .header-inner { width:100%; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
        .wordmark { color:var(--ink); font-weight:bold; text-decoration:none; letter-spacing:.02em; }
        .site-main { width:100%; padding:24px 16px 32px; }
        .site-footer { border-top:1px solid var(--hairline); padding:12px 16px; color:var(--muted); font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        .prose { max-width:72ch; color:var(--ink); }
        .prose h1,.prose h2,.prose h3 { color:var(--ink); font-weight:bold; line-height:1.15; }
        .prose h1 { font-size:28px; margin:0 0 16px; }
        .prose h2 { font-size:21px; margin:24px 0 8px; border-top:1px solid var(--hairline); padding-top:8px; }
        .prose h3 { font-size:18px; margin:16px 0 8px; }
        .prose p { margin:0 0 12px; }
        .prose ul,.prose ol { margin:0 0 12px; padding-left:24px; }
        .prose li { margin-bottom:4px; }
        .prose blockquote { margin:16px 0; padding:8px 16px; border-left:3px solid var(--ink); background:var(--surface); }
        .prose code { background:var(--surface); padding:1px 4px; }
        .prose pre { overflow:auto; border:1px solid var(--hairline); padding:12px; background:var(--surface); }
        .prose table { border-collapse:collapse; width:100%; margin:16px 0; }
        .prose th,.prose td { border:1px solid var(--hairline); padding:6px 8px; text-align:left; }
        .prose th { background:var(--surface); }
        .prose img { max-width:100%; height:auto; }
        .muted { color:var(--muted); }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        @media (max-width:640px) { .site-main { padding:16px 10px 24px; } .header-inner { padding:10px; } }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; scroll-behavior:auto!important; } }
    </style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a href="/" class="wordmark" style="display:inline-flex;align-items:center;gap:8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.25 1.75h7.2L14.75 6v10.25H3.25z"/><path d="M10.25 1.75V6h4.5M5.75 9h6.5M5.75 12h6.5"/></svg><span>SUMMARIZER</span></a><div style="display:flex;align-items:center;gap:16px"><span class="muted" style="font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">READ · PROCESS · REVISIT</span><button type="button" id="theme-toggle" aria-label="Toggle dark mode" style="border:1px solid var(--ink);background:var(--ground);padding:5px 9px;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Dark</button></div></div></header>
<main class="site-main">{% block content %}{% endblock %}</main>
<footer class="site-footer">A quiet workspace for turning sources into readable notes. <a href="/">New source</a></footer>
<div id="toast-container" aria-live="polite" style="position:fixed;bottom:16px;right:16px;z-index:50"></div>
<script>
const themeToggle = document.getElementById('theme-toggle');
function updateThemeToggle() { const dark = document.documentElement.dataset.theme === 'dark'; themeToggle.textContent = dark ? 'Light' : 'Dark'; themeToggle.setAttribute('aria-pressed', String(dark)); }
themeToggle.addEventListener('click', () => { const dark = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; localStorage.setItem('summarizer-theme', dark ? 'dark' : 'light'); updateThemeToggle(); });
updateThemeToggle();
function showToast(msg) { const c=document.getElementById('toast-container'); const t=document.createElement('div'); t.textContent=msg; t.style.cssText='background:#000;color:#fff;border:1px solid #000;padding:8px 12px;margin-top:8px;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif'; c.appendChild(t); setTimeout(()=>t.remove(),3000); }
function copyText(text,label) { navigator.clipboard.writeText(text).then(()=>showToast(label+' copied')).catch(()=>showToast('Copy failed')); }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
